<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Space</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header class="bar">
        <div class="brand">
            <img src="assets/icons/logo.png" class="logo">
            <h1>Sweet Space</h1>
        </div>
        <nav>
        <ul>
            <div class="features">
                <img src="assets/icons/features.png">
                <li><a href="#features">Features</a></li>
            </div>
            <div class="apps">
                <img src="assets/icons/apps.png">
                <li><a href="#Apps">Apps</a></li>
            </div>
            <div class="about">
                <img src="assets/icons/about.png">
                <li><a href="#About">About</a></li>
            </div>
        </ul>
        <button type="button" class="navButton active">
            <div class="log">
                <img src="assets/icons/logIn.png" class="logIn">
                <p>Log In</p>
            </div>
        </button>
    </nav>
    </header>

    <h1>
        <span class="welcome">Welcome to</span>
        <span class="title">Sweet Space</span> 
    </h1>

    <p class="description">Your cute space to focus, relax,<br>and grow every day</p>

    <button type="button" class="startButton" id="startButton">
            <p>Get Started</p>
            <img src="assets/icons/start.png" class="logoStart">
    </button>

    <img src="assets/backgrounds/background.png" class="background">
    <script src="js/script.js"></script>
</body>
</html>
